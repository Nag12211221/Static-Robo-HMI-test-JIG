<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated aluminum frame build sequence</title>
  <desc id="desc">Step-by-step animation for assembling the HMI test jig frame: base rails, support posts, top rail, cable rail, and alignment blocks.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#d7dce2"/>
      <stop offset="0.45" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#aeb6bf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <style>
      .bg{fill:#f5f7fb}.bench{fill:#5d6470}.rail{fill:url(#metal);stroke:#7b8490;stroke-width:2;filter:url(#shadow)}.slot{stroke:#9aa3ad;stroke-width:2}.bolt{fill:#606a75}.label{font:700 20px Arial, sans-serif;fill:#1f2937}.note{font:15px Arial, sans-serif;fill:#374151}.step{opacity:0}.guide{fill:#111827}.orange{fill:#f97316}
      #base{animation:show 12s infinite}#posts{animation:show 12s infinite 2s}#top{animation:show 12s infinite 4s}#cable{animation:show 12s infinite 6s}#blocks{animation:show 12s infinite 8s}
      @keyframes show{0%,12%{opacity:0;transform:translateY(-18px)}18%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    </style>
  </defs>
  <rect class="bg" width="900" height="420" rx="18"/>
  <text class="label" x="34" y="42">Step 1 — Aluminum extrusion frame</text>
  <text class="note" x="34" y="68">Build from the table upward: base rails → vertical posts → upper rail → cable rail → alignment blocks.</text>
  <rect class="bench" x="55" y="355" width="790" height="24" rx="5"/>
  <g id="base" class="step">
    <rect class="rail" x="95" y="305" width="710" height="38" rx="4"/>
    <line class="slot" x1="110" y1="324" x2="790" y2="324"/>
    <rect class="rail" x="120" y="270" width="660" height="24" rx="4"/>
    <circle class="bolt" cx="145" cy="324" r="5"/><circle class="bolt" cx="755" cy="324" r="5"/>
    <text class="note" x="310" y="336">base T-slot rails</text>
  </g>
  <g id="posts" class="step">
    <rect class="rail" x="120" y="122" width="24" height="185" rx="5"/>
    <rect class="rail" x="756" y="122" width="24" height="185" rx="5"/>
    <rect class="rail" x="170" y="130" width="16" height="170" rx="5"/>
    <rect class="rail" x="714" y="130" width="16" height="170" rx="5"/>
    <text class="note" x="374" y="292">side support posts</text>
  </g>
  <g id="top" class="step">
    <rect class="rail" x="95" y="95" width="710" height="36" rx="4"/>
    <line class="slot" x1="110" y1="113" x2="790" y2="113"/>
    <circle class="bolt" cx="145" cy="113" r="5"/><circle class="bolt" cx="755" cy="113" r="5"/>
    <text class="note" x="360" y="121">upper cross rail</text>
  </g>
  <g id="cable" class="step">
    <path d="M155 78 C230 55, 640 55, 745 78" fill="none" stroke="#111827" stroke-width="18" stroke-linecap="round"/>
    <path d="M155 78 C230 55, 640 55, 745 78" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <rect class="rail" x="155" y="70" width="38" height="22" rx="3"/>
    <rect class="rail" x="420" y="58" width="38" height="22" rx="3"/>
    <rect class="rail" x="706" y="70" width="38" height="22" rx="3"/>
    <text class="note" x="365" y="88">top harness support path</text>
  </g>
  <g id="blocks" class="step">
    <rect class="guide" x="95" y="332" width="70" height="32" rx="5"/>
    <rect class="guide" x="735" y="332" width="70" height="32" rx="5"/>
    <rect class="guide" x="390" y="329" width="120" height="30" rx="5"/>
    <rect class="orange" x="444" y="329" width="28" height="30" rx="3"/>
    <text class="note" x="332" y="394">front locating and locking blocks</text>
  </g>
</svg>
