<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated connector panel installation</title>
  <desc id="desc">Step-by-step animation showing removable front panels, repeated connector groups, fasteners, and labeling zones.</desc>
  <defs>
    <linearGradient id="plate" x1="0" x2="1">
      <stop offset="0" stop-color="#b9c1cc"/>
      <stop offset="0.5" stop-color="#f0f2f5"/>
      <stop offset="1" stop-color="#9da7b3"/>
    </linearGradient>
    <style>
      .bg{fill:#f7f8fb}.rail{fill:#e5e7eb;stroke:#8b95a1;stroke-width:2}.panel{fill:url(#plate);stroke:#687380;stroke-width:2}.bolt{fill:#59636f}.port{fill:#111827}.pin{fill:#d6a34a;stroke:#6b4f16;stroke-width:1}.label{font:700 20px Arial, sans-serif;fill:#1f2937}.note{font:15px Arial, sans-serif;fill:#374151}.tag{font:700 12px Arial, sans-serif;fill:#111827}.step{opacity:0}.highlight{fill:none;stroke:#22c55e;stroke-width:4;stroke-dasharray:8 8}
      #p1{animation:drop 12s infinite}#p2{animation:drop 12s infinite 1.4s}#p3{animation:drop 12s infinite 2.8s}#connectors{animation:show 12s infinite 4.4s}#fasteners{animation:show 12s infinite 6.2s}#labels{animation:show 12s infinite 8s}
      @keyframes drop{0%,12%{opacity:0;transform:translateY(-60px)}22%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
      @keyframes show{0%,12%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
    </style>
  </defs>
  <rect class="bg" width="900" height="420" rx="18"/>
  <text class="label" x="34" y="42">Step 2 — Removable connector panels</text>
  <text class="note" x="34" y="68">Install panel plates, populate repeated connector groups, then add fasteners and labels.</text>
  <rect class="rail" x="80" y="90" width="740" height="32" rx="4"/>
  <rect class="rail" x="80" y="335" width="740" height="32" rx="4"/>
  <g id="p1" class="step"><rect class="panel" x="150" y="125" width="170" height="205" rx="5"/></g>
  <g id="p2" class="step"><rect class="panel" x="365" y="125" width="170" height="205" rx="5"/></g>
  <g id="p3" class="step"><rect class="panel" x="580" y="125" width="170" height="205" rx="5"/></g>
  <g id="connectors" class="step">
    <g transform="translate(150 125)">
      <circle class="pin" cx="35" cy="42" r="7"/><rect class="port" x="68" y="34" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="42" r="7"/>
      <circle class="pin" cx="35" cy="83" r="7"/><rect class="port" x="68" y="75" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="83" r="7"/>
      <circle class="pin" cx="35" cy="124" r="7"/><rect class="port" x="68" y="116" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="124" r="7"/>
      <circle class="pin" cx="35" cy="165" r="7"/><rect class="port" x="68" y="157" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="165" r="7"/>
    </g>
    <g transform="translate(365 125)">
      <circle class="pin" cx="35" cy="42" r="7"/><rect class="port" x="68" y="34" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="42" r="7"/>
      <circle class="pin" cx="35" cy="83" r="7"/><rect class="port" x="68" y="75" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="83" r="7"/>
      <circle class="pin" cx="35" cy="124" r="7"/><rect class="port" x="68" y="116" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="124" r="7"/>
      <circle class="pin" cx="35" cy="165" r="7"/><rect class="port" x="68" y="157" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="165" r="7"/>
    </g>
    <g transform="translate(580 125)">
      <circle class="pin" cx="35" cy="42" r="7"/><rect class="port" x="68" y="34" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="42" r="7"/>
      <circle class="pin" cx="35" cy="83" r="7"/><rect class="port" x="68" y="75" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="83" r="7"/>
      <circle class="pin" cx="35" cy="124" r="7"/><rect class="port" x="68" y="116" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="124" r="7"/>
      <circle class="pin" cx="35" cy="165" r="7"/><rect class="port" x="68" y="157" width="22" height="16" rx="2"/><circle class="pin" cx="125" cy="165" r="7"/>
    </g>
  </g>
  <g id="fasteners" class="step">
    <circle class="bolt" cx="165" cy="140" r="5"/><circle class="bolt" cx="305" cy="140" r="5"/><circle class="bolt" cx="165" cy="315" r="5"/><circle class="bolt" cx="305" cy="315" r="5"/>
    <circle class="bolt" cx="380" cy="140" r="5"/><circle class="bolt" cx="520" cy="140" r="5"/><circle class="bolt" cx="380" cy="315" r="5"/><circle class="bolt" cx="520" cy="315" r="5"/>
    <circle class="bolt" cx="595" cy="140" r="5"/><circle class="bolt" cx="735" cy="140" r="5"/><circle class="bolt" cx="595" cy="315" r="5"/><circle class="bolt" cx="735" cy="315" r="5"/>
    <rect class="highlight" x="145" y="120" width="180" height="215" rx="8"/>
    <rect class="highlight" x="360" y="120" width="180" height="215" rx="8"/>
    <rect class="highlight" x="575" y="120" width="180" height="215" rx="8"/>
  </g>
  <g id="labels" class="step">
    <rect fill="#fde68a" x="190" y="292" width="90" height="20" rx="3"/><text class="tag" x="202" y="306">PANEL A</text>
    <rect fill="#bfdbfe" x="405" y="292" width="90" height="20" rx="3"/><text class="tag" x="417" y="306">PANEL B</text>
    <rect fill="#bbf7d0" x="620" y="292" width="90" height="20" rx="3"/><text class="tag" x="632" y="306">PANEL C</text>
    <text class="note" x="310" y="392">repeat the same panel pattern for each HMI connector group</text>
  </g>
</svg>
