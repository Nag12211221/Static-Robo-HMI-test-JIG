<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated wiring and test sequence</title>
  <desc id="desc">Animation showing top harness routing, branch drops to panels, control box connection, and test sequence status.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.rail{fill:#e5e7eb;stroke:#8b95a1;stroke-width:2}.panel{fill:#cbd5e1;stroke:#64748b;stroke-width:2}.box{fill:#1f2937;stroke:#111827;stroke-width:2}.din{fill:#6b7280}.wire{fill:none;stroke-linecap:round;stroke-width:8}.red{stroke:#ef4444}.black{stroke:#111827}.blue{stroke:#2563eb}.green{stroke:#22c55e}.yellow{stroke:#f59e0b}.thin{stroke-width:3}.label{font:700 20px Arial, sans-serif;fill:#1f2937}.note{font:15px Arial, sans-serif;fill:#374151}.small{font:700 12px Arial, sans-serif;fill:#f9fafb}.step{opacity:0}.lamp{fill:#374151}.pass{fill:#22c55e}.fail{fill:#ef4444}
      #harness{animation:show 14s infinite}#drops{animation:show 14s infinite 2s}#control{animation:show 14s infinite 4s}#tests{animation:show 14s infinite 6s}#flow{stroke-dasharray:16 12;animation:move 1s linear infinite, show 14s infinite 6s}
      @keyframes show{0%,10%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
      @keyframes move{to{stroke-dashoffset:-56}}
    </style>
  </defs>
  <rect class="bg" width="900" height="420" rx="18"/>
  <text class="label" x="34" y="42">Step 3 — Harness routing and automated test flow</text>
  <text class="note" x="34" y="68">Route, clamp, branch, terminate, then run continuity → short → power → functional tests.</text>
  <rect class="rail" x="75" y="90" width="560" height="32" rx="4"/>
  <rect class="rail" x="75" y="318" width="560" height="32" rx="4"/>
  <rect class="panel" x="120" y="135" width="115" height="175" rx="5"/>
  <rect class="panel" x="280" y="135" width="115" height="175" rx="5"/>
  <rect class="panel" x="440" y="135" width="115" height="175" rx="5"/>
  <g id="harness" class="step">
    <path class="wire black" d="M105 88 C180 52, 520 52, 615 88"/>
    <path class="wire red thin" d="M105 88 C180 52, 520 52, 615 88"/>
    <rect fill="#f8fafc" stroke="#94a3b8" x="170" y="70" width="36" height="22" rx="3"/>
    <rect fill="#f8fafc" stroke="#94a3b8" x="340" y="61" width="36" height="22" rx="3"/>
    <rect fill="#f8fafc" stroke="#94a3b8" x="510" y="70" width="36" height="22" rx="3"/>
    <text class="note" x="220" y="104">clamped top harness</text>
  </g>
  <g id="drops" class="step">
    <path class="wire red" d="M190 91 L190 135"/>
    <path class="wire blue" d="M350 82 L350 135"/>
    <path class="wire yellow" d="M520 91 L520 135"/>
    <circle fill="#d6a34a" cx="150" cy="170" r="7"/><rect fill="#111827" x="172" y="162" width="22" height="16" rx="2"/><circle fill="#d6a34a" cx="210" cy="170" r="7"/>
    <circle fill="#d6a34a" cx="310" cy="170" r="7"/><rect fill="#111827" x="332" y="162" width="22" height="16" rx="2"/><circle fill="#d6a34a" cx="370" cy="170" r="7"/>
    <circle fill="#d6a34a" cx="470" cy="170" r="7"/><rect fill="#111827" x="492" y="162" width="22" height="16" rx="2"/><circle fill="#d6a34a" cx="530" cy="170" r="7"/>
    <text class="note" x="118" y="295">drop branches into each panel</text>
  </g>
  <g id="control" class="step">
    <rect class="box" x="670" y="120" width="170" height="220" rx="10"/>
    <rect class="din" x="692" y="154" width="126" height="18" rx="2"/>
    <rect fill="#e5e7eb" x="696" y="190" width="42" height="58" rx="4"/>
    <rect fill="#e5e7eb" x="748" y="190" width="42" height="58" rx="4"/>
    <rect fill="#e5e7eb" x="696" y="265" width="94" height="28" rx="4"/>
    <text class="small" x="701" y="144">CONTROL BOX</text>
    <text class="small" x="704" y="224" fill="#111827">PLC</text>
    <text class="small" x="754" y="224" fill="#111827">DAQ</text>
    <path class="wire black" d="M555 174 C620 174, 620 230, 670 230"/>
    <path class="wire green thin" d="M555 194 C620 194, 620 255, 670 255"/>
  </g>
  <g id="tests" class="step">
    <path id="flow" class="wire green thin" d="M690 360 H820"/>
    <circle class="lamp pass" cx="695" cy="360" r="11"/><text class="note" x="712" y="365">continuity</text>
    <circle class="lamp pass" cx="695" cy="386" r="11"/><text class="note" x="712" y="391">short check</text>
    <circle class="lamp pass" cx="805" cy="360" r="11"/><text class="note" x="822" y="365">power</text>
    <circle class="lamp pass" cx="805" cy="386" r="11"/><text class="note" x="822" y="391">function</text>
  </g>
</svg>
